<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pi, step by step</title>
<style>
:root{
  --bg:#f6f6f3;--fg:#1c1c1f;--muted:#66666d;--card:#ffffff;--line:#e2e2dd;--soft:#efefea;--accent:#3b5bdb;
  --cpu:#e8590c;--wall:#1c7ed6;--mem:#7048e8;--sys:#5c636a;--disk:#2f9e44;--net:#0c8599;--proc:#c2255c;
  --main:#e8590c;--v8:#f59f00;--uv:#12b886;--oth:#adb5bd;--bad:#e03131;--good:#2f9e44;--warn:#f08c00;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121315;--fg:#ececf0;--muted:#9d9da6;--card:#1b1c20;--line:#2d2e33;--soft:#232429;--accent:#748ffc;
  --sys:#adb5bd;--oth:#5c636a;
}}
:root[data-theme="dark"]{--bg:#121315;--fg:#ececf0;--muted:#9d9da6;--card:#1b1c20;--line:#2d2e33;--soft:#232429;--accent:#748ffc;--sys:#adb5bd;--oth:#5c636a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
.slide{display:none;max-width:1200px;margin:0 auto;padding:26px 24px 96px;min-height:100vh}
.slide.on{display:block;animation:fade .22s ease-out}
@keyframes fade{from{transform:translateY(6px)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.slide.on{animation:none}}
h1{font-size:44px;line-height:1.1;margin:.15em 0 .3em;letter-spacing:-.02em}
h2{font-size:30px;line-height:1.2;margin:.1em 0 .35em;letter-spacing:-.01em}
h3{font-size:17px;margin:0 0 .4em}
p{margin:.3em 0 .7em}
.kicker{color:var(--accent);font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:12.5px}
.lead{font-size:19px;color:var(--muted);max-width:900px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.tiny{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card h3 .tag{font-weight:600;color:var(--muted);font-size:12.5px;margin-left:6px}
.meter{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0 14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;border-top:4px solid var(--c,var(--line));min-width:0}
.tile .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tile .v{font-size:19px;font-weight:750;line-height:1.2;margin-top:2px}
.tile .n{font-size:12px;color:var(--muted);line-height:1.3;margin-top:3px}
.analogy{border-left:4px solid var(--accent);background:var(--soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.analogy b{color:var(--accent)}
.take{border:1px solid var(--line);border-left:4px solid var(--good);background:var(--card);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.warnbox{border-left:4px solid var(--bad);background:var(--soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.big{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1}
.big small{font-size:15px;font-weight:600;color:var(--muted);margin-left:4px}
ul.clean{margin:.2em 0;padding-left:1.1em}ul.clean li{margin:.25em 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
th{color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
code{font:13px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);padding:1px 5px;border-radius:5px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:8px 0}
.flow .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px;min-width:110px;flex:1;border-top:4px solid var(--c,var(--line))}
.flow .box b{display:block;font-size:14px}
.flow .arr{align-self:center;color:var(--muted);font-size:20px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);margin:2px 3px 2px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--fg);font-family:inherit}
svg .mut{fill:var(--muted)}
svg .grid line{stroke:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-top:6px}
.sbar{display:flex;gap:2px;width:100%}
.sbar>div{display:flex;align-items:center;min-width:2px;border-radius:6px;overflow:hidden}
.sbar span{color:#fff;font-weight:700;font-size:14px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{display:grid;gap:7px 10px;align-items:center;font-size:14px;margin:4px 0}
.hb-l{text-align:right;line-height:1.25}
.hb-t{display:flex;align-items:center;gap:8px;min-width:0}
.hb-b{height:18px;border-radius:5px;flex:none;min-width:3px}
.hb-t span{font-weight:700;white-space:nowrap}
.hb.compact{gap:1px 10px;font-size:12.5px}.hb.compact .hb-b{height:12px}.hb.compact .hb-l{line-height:1.15}
.title-art{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:26px 0}
.title-art div{height:8px;border-radius:4px}
.step-n{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:15px;margin-right:8px;vertical-align:4px}
.slide.wide{max-width:1560px}
.gl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.gl .card{padding:12px 14px;border-top:4px solid var(--c)}
.gl h3{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.gl h3 i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.term{font-size:13px;line-height:1.36;margin:0 0 4px}
.term b{font-weight:700}
.term .ex{display:inline-block;font-size:11.5px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-left:3px;white-space:nowrap}
.units{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-top:12px;padding:9px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
@media (max-width:900px){.gl{grid-template-columns:1fr}}
.tree{font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;background:var(--soft);border-radius:10px;padding:10px 12px;overflow-x:auto}
nav#bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 16px;z-index:10}
nav#bar button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:6px 14px;font:inherit;cursor:pointer}
nav#bar button:hover{border-color:var(--accent)}
#prog{flex:1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
#prog div{height:100%;background:var(--accent);width:0;transition:width .2s}
#cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:64px;text-align:right}
#ov{display:none;position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:24px}
#ov.on{display:block}
#ov .list{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
#ov a{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);text-decoration:none;font-size:14px}
#ov a:hover{border-color:var(--accent)}
#ov a span{color:var(--muted);font-size:12px;display:block}
@media (max-width:900px){
  .g2,.g3,.g4,.g21,.g12{grid-template-columns:1fr}
  .meter{grid-template-columns:repeat(2,1fr)}
  h1{font-size:32px}h2{font-size:24px}.big{font-size:32px}
  .slide{padding:18px 16px 96px}
}
</style>
</head>
<body>
<div id="deck"></div>
<div id="ov"><div style="max-width:1100px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">All slides</h2><button onclick="toggleOv()" style="background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:6px 14px;font:inherit;cursor:pointer">Close (O)</button></div><div class="list" id="ovlist"></div></div>
<nav id="bar"><button onclick="go(cur-1)" aria-label="Previous">←</button><button onclick="go(cur+1)" aria-label="Next">→</button><div id="prog"><div></div></div><span id="cnt"></span><button onclick="toggleOv()">All slides</button><button onclick="toggleTheme()" title="Light / dark">◐</button></nav>
<script>
// ---------- tiny SVG chart helpers ----------
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const V = (n) => `var(--${n})`;
const fmt = (v, d = 1) => (Math.abs(v) >= 100 || Number.isInteger(v) ? Math.round(v).toLocaleString("en-US") : v.toFixed(d));

// horizontal stacked bar + legend (HTML, so text never stretches)
function stack(segs, o = {}) {
  const H = o.h || 44, total = o.total || segs.reduce((a, s) => a + s.v, 0), unit = o.unit || "ms";
  const bar = segs.map((s) => {
    const pct = (s.v / total) * 100, lab = s.short ?? `${fmt(s.v)} ${unit}`;
    return `<div style="flex:0 0 ${pct}%;background:${s.c};opacity:${s.o || 1}" title="${esc(s.l)}: ${s.v} ${unit}"><span>${lab && pct >= (s.short ? 3.5 : 9) ? esc(lab) : ""}</span></div>`;
  }).join("");
  const leg = segs.filter((s) => s.l).map((s) => `<span><i class="dot" style="background:${s.c};opacity:${s.o || 1}"></i>${esc(s.l)} <b>${fmt(s.v, s.d ?? 1)} ${unit}</b></span>`).join("");
  return `<div class="sbar" style="height:${H}px">${bar}</div><div class="legend">${leg}</div>`;
}

// labelled horizontal bars (HTML grid)
function hbars(rows, o = {}) {
  const max = o.max || Math.max(...rows.map((r) => r.v));
  const lw = Math.round((o.lw || 300) * 0.55), vw = Math.round((o.vw || 150) * 0.8);
  const body = rows.map((r) => {
    const f = Math.max(r.v / max, 0.004);
    return `<div class="hb-l">${esc(r.l)}</div><div class="hb-t"><div class="hb-b" style="width:calc((100% - ${vw}px) * ${f.toFixed(4)});background:${r.c || V("accent")}" title="${esc(r.l)}: ${r.v}"></div><span>${esc(r.t ?? fmt(r.v) + (o.unit ? " " + o.unit : ""))}</span></div>`;
  }).join("");
  return `<div class="hb${o.compact ? " compact" : ""}" style="grid-template-columns:minmax(80px,${lw}px) 1fr">${body}</div>`;
}

// multi-series line chart
function line(series, o = {}) {
  const W = o.w || 620, H = o.h || 300, L = 62, R = 18, T = 14, B = 44;
  const xs = series.flatMap((s) => s.pts.map((p) => p[0])), ys = series.flatMap((s) => s.pts.map((p) => p[1]));
  const xmin = o.xmin ?? Math.min(...xs), xmax = o.xmax ?? Math.max(...xs), ymin = o.ymin ?? 0, ymax = o.ymax ?? Math.max(...ys) * 1.08;
  const X = (x) => L + ((x - xmin) / (xmax - xmin)) * (W - L - R), Y = (y) => H - B - ((y - ymin) / (ymax - ymin)) * (H - T - B);
  let g = '<g class="grid">';
  const yt = o.yticks || 5, xt = o.xticks || 5;
  for (let i = 0; i <= yt; i++) { const v = ymin + ((ymax - ymin) * i) / yt; g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="mut" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" style="font-size:12px">${esc((o.yf || fmt)(v))}</text>`; }
  for (let i = 0; i <= xt; i++) { const v = xmin + ((xmax - xmin) * i) / xt; g += `<text class="mut" x="${X(v)}" y="${H - B + 18}" text-anchor="middle" style="font-size:12px">${esc((o.xf || fmt)(v))}</text>`; }
  g += "</g>";
  let s = "";
  series.forEach((se) => {
    const d = se.pts.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
    if (se.area) s += `<path d="${d}L${X(se.pts.at(-1)[0])},${Y(ymin)}L${X(se.pts[0][0])},${Y(ymin)}Z" fill="${se.c}" opacity=".12"/>`;
    s += `<path d="${d}" fill="none" stroke="${se.c}" stroke-width="${se.w || 3}" ${se.dash ? 'stroke-dasharray="6 5"' : ""} stroke-linejoin="round"/>`;
    if (se.dots) se.pts.forEach((p) => (s += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4.5" fill="${se.c}"><title>${p[0]}: ${p[1]}</title></circle>`));
    if (se.label) { const p = se.labelAt || se.pts.at(-1); s += `<text x="${X(p[0]) + (se.labelAt ? 0 : -6)}" y="${Y(p[1]) - (se.labelAt ? 0 : 10)}" text-anchor="${se.anchor || "end"}" style="font-size:13px;font-weight:700;fill:${se.c}">${esc(se.label)}</text>`; }
  });
  (o.notes || []).forEach((n) => (s += `<text x="${X(n[0])}" y="${Y(n[1])}" style="font-size:12.5px" class="mut" text-anchor="${n[3] || "start"}">${esc(n[2])}</text>`));
  const ax = `<text class="mut" x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle" style="font-size:12.5px">${esc(o.xl || "")}</text><text class="mut" transform="translate(14 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle" style="font-size:12.5px">${esc(o.yl || "")}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}${s}${ax}</svg>`;
}

// gantt / swimlanes
function gantt(lanes, o) {
  const W = 1100, lw = 190, rh = 40, T = 26, H = T + lanes.length * rh + 30, tmax = o.tmax;
  const X = (t) => lw + (t / tmax) * (W - lw - 14);
  let s = "";
  (o.markers || []).forEach((m) => { s += `<line x1="${X(m[0])}" x2="${X(m[0])}" y1="${T - 6}" y2="${H - 24}" stroke="var(--line)" stroke-width="2"/><text x="${X(m[0]) + 4}" y="${T - 10}" style="font-size:12.5px;font-weight:700" class="mut">${esc(m[1])}</text>`; });
  lanes.forEach((ln, i) => {
    const y = T + i * rh;
    s += `<text x="${lw - 10}" y="${y + rh / 2 + 5}" text-anchor="end" style="font-size:14px">${esc(ln.n)}</text>`;
    ln.s.forEach((g) => {
      const x1 = X(g[0]), x2 = X(g[1]);
      s += `<rect x="${x1}" y="${y + 6}" width="${Math.max(x2 - x1, 2)}" height="${rh - 12}" rx="5" fill="${g[2]}" opacity="${g[4] ?? 1}"><title>${esc(ln.n)} ${g[0]}–${g[1]} ms: ${esc(g[3] || "")}</title></rect>`;
      if (x2 - x1 > 120 && g[3]) s += `<text x="${x1 + 7}" y="${y + rh / 2 + 5}" style="font-size:12.5px;font-weight:650;fill:${g[5] || "#fff"}">${esc(g[3])}</text>`;
    });
  });
  for (let t = 0; t <= tmax; t += o.tick || 25) s += `<text class="mut" x="${X(t)}" y="${H - 6}" text-anchor="middle" style="font-size:12px">${t}</text>`;
  s += `<text class="mut" x="${W - 14}" y="${H - 6}" text-anchor="end" style="font-size:12px">ms</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${s}</svg>`;
}

// donut
function donut(parts, o = {}) {
  const S = 220, r = 80, w = 34, cx = S / 2, cy = S / 2, tot = parts.reduce((a, p) => a + p.v, 0);
  let a0 = -Math.PI / 2, s = "";
  parts.forEach((p) => {
    const a1 = a0 + (p.v / tot) * Math.PI * 2, big = a1 - a0 > Math.PI ? 1 : 0;
    const p0 = [cx + r * Math.cos(a0), cy + r * Math.sin(a0)], p1 = [cx + r * Math.cos(a1), cy + r * Math.sin(a1)];
    s += `<path d="M${p0[0]},${p0[1]} A${r},${r} 0 ${big} 1 ${p1[0]},${p1[1]}" fill="none" stroke="${p.c}" stroke-width="${w}"><title>${esc(p.l)}: ${p.v}</title></path>`;
    a0 = a1;
  });
  s += `<text x="${cx}" y="${cy - 2}" text-anchor="middle" style="font-size:24px;font-weight:800">${esc(o.c1 || "")}</text><text x="${cx}" y="${cy + 20}" text-anchor="middle" class="mut" style="font-size:13px">${esc(o.c2 || "")}</text>`;
  const leg = parts.map((p) => `<div><i class="dot" style="background:${p.c}"></i>${esc(p.l)} <b>${esc(p.t ?? p.v)}</b></div>`).join("");
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 ${S} ${S}" width="200" height="200">${s}</svg><div class="small" style="display:grid;gap:4px">${leg}</div></div>`;
}

// resource meter (7 tiles)
function meter(m) {
  const t = (k, c, l) => `<div class="tile" style="--c:var(--${c})"><div class="l">${l}</div><div class="v">${m[k][0]}</div><div class="n">${m[k][1] || ""}</div></div>`;
  return `<div class="meter">${t("wall", "wall", "Wall time")}${t("cpu", "cpu", "CPU time")}${t("mem", "mem", "Memory")}${t("sys", "sys", "Syscalls")}${t("disk", "disk", "Disk")}${t("net", "net", "Network")}${t("proc", "proc", "Procs / threads")}</div>`;
}
const flow = (boxes) => `<div class="flow">${boxes.map((b, i) => (i ? '<span class="arr">→</span>' : "") + `<div class="box" style="--c:${b.c || "var(--line)"}"><b>${b.t}</b>${b.d || ""}</div>`).join("")}</div>`;
const head = (n, title, sub) => `<div class="kicker">${n ? "Step " + n : sub || ""}</div><h2>${n ? `<span class="step-n">${n}</span>` : ""}${title}</h2>`;

// ---------- data used by charts ----------
const req04 = Array.from({ length: 201 }, (_, k) => [k, 5.593 + 0.237 * k]);
const req05 = [...Array.from({ length: 291 }, (_, k) => [k, 6.063 + 2.494 * k]), [291, 97.4], [300, 115]];
const cum = (arr) => { let a = 0; return arr.map(([k, v]) => [k, (a += v) / 1000]); };

// ---------- slides ----------
const S = [];

S.push({ t: "Title", h: `
<div style="min-height:70vh;display:flex;flex-direction:column;justify-content:center">
<div class="kicker">harness-xray · a learning deck</div>
<h1>How an AI coding agent spends a computer</h1>
<p class="lead">We put <b>pi</b> (a Node.js coding agent) in Docker, drove it with scripted work, and traced every process, thread, syscall, byte and millisecond with eBPF. This deck walks through one run, step by step, and shows what each step costs.</p>
<div class="title-art"><div style="background:var(--wall)"></div><div style="background:var(--cpu)"></div><div style="background:var(--mem)"></div><div style="background:var(--sys)"></div><div style="background:var(--disk)"></div><div style="background:var(--net)"></div><div style="background:var(--proc)"></div></div>
<p class="muted small">pi 0.87.1 · Node 24 · Docker Desktop VM on an Apple M5 Max (18 vCPU, 11.6 GB) · 24 scenarios on a mock model plus 3 on a real model: 27 runs, each in a fresh container</p>
<p class="small" style="margin:14px 0"><a href="primer/" style="font-weight:700">New to CPUs, memory, containers? Start with the primer: From Cores to Containers →</a></p>
<p class="small"><span class="chip">← → or space to move</span><span class="chip">O = all slides</span><span class="chip">◐ = light / dark</span></p>
</div>` });

S.push({ t: "Glossary: every metric", w: 1, h: `
${head(0, "Every metric and resource in this deck, in plain words", "Glossary")}
<div class="gl">
<div class="card" style="--c:var(--cpu)"><h3><i></i>CPU</h3>
<div class="term"><b>Wall time</b>: stopwatch time from start to finish. <span class="ex">191.8 ms one-turn chat</span></div>
<div class="term"><b>CPU time</b>: time cores spent running this program, added up over all its threads, so it can be more than wall time. <span class="ex">246.5 ms</span></div>
<div class="term"><b>User / system CPU</b>: user = running pi's own code; system = the kernel working for pi (syscalls, page faults). <span class="ex">170 / 23 ms up to the first request</span></div>
<div class="term"><b>Cores busy (vCPUs)</b>: CPU time ÷ wall time. 1.3 = one core flat out plus a third of another. <span class="ex">≈1.3 at startup</span></div>
<div class="term"><b>ms/s</b>: CPU milliseconds used per second of wall time; 10 ms/s = 1% of one core. <span class="ex">TUI 185 ms/s</span></div>
<div class="term"><b>Run-queue wait</b>: time a thread was ready to run but every core was taken. Grows when the machine is crowded. <span class="ex">1.72 ms per ms at 32 agents</span></div>
</div>
<div class="card" style="--c:var(--mem)"><h3><i></i>Memory</h3>
<div class="term"><b>RSS</b>: all RAM pages the process holds right now, including code shared with other processes. <span class="ex">146.5 MiB peak</span></div>
<div class="term"><b>Private / shared</b>: private pages belong to this process only (each extra agent adds these); shared ones (node binary, libraries) are paid once. <span class="ex">≈78 / 50 MiB</span></div>
<div class="term"><b>JS heap</b>: memory V8 manages for JavaScript objects; <i>used</i> = live objects, <i>total</i> = reserved. <span class="ex">22 / 37 MiB</span></div>
<div class="term"><b>External</b>: memory outside the heap, such as Buffers holding file and network data. <span class="ex">13 MiB</span></div>
<div class="term"><b>Page fault</b>: first touch of a memory page. Minor = filled from RAM; major = had to wait for the disk. <span class="ex">19,107 minor · 0 major</span></div>
<div class="term"><b>GC</b>: V8 freeing objects no longer used; minor (young objects, quick) or major (whole heap). <span class="ex">0.12 ms per turn</span></div>
<div class="term"><b>Container memory</b>: everything the container's cgroup is charged for, across all its processes. <span class="ex">≈18 + 102 MiB × agents</span></div>
</div>
<div class="card" style="--c:var(--sys)"><h3><i></i>Kernel &amp; syscalls</h3>
<div class="term"><b>Syscall</b>: a request from a program to the kernel. Everything outside pure computation goes through one. <span class="ex">5,022 before the first request</span></div>
<div class="term"><b>read / write</b> move bytes to or from files, pipes and sockets · <b>openat / close</b> open and close files · <b>statx / faccessat</b> look up a file's details or whether it exists</div>
<div class="term"><b>mmap / munmap / brk / madvise</b> get or give back memory · <b>mprotect</b> change page permissions (V8 flips code pages between writable and executable)</div>
<div class="term"><b>futex</b> threads waiting for or waking each other · <b>epoll_pwait</b> sleep until a socket or timer needs attention</div>
<div class="term"><b>clone</b> create a thread or process · <b>execve</b> turn a process into another program · <b>wait4</b> collect a finished child</div>
<div class="term"><b>Context switch</b>: a thread leaves its core. Voluntary = it chose to wait; forced = the scheduler took the core away. <span class="ex">477 voluntary · 0 forced</span></div>
</div>
<div class="card" style="--c:var(--disk)"><h3><i></i>Disk &amp; files</h3>
<div class="term"><b>File cache</b>: the kernel's RAM copy of recently used files. Reads served from it never touch the disk. <span class="ex">4.5 MB of code, 0 B from disk</span></div>
<div class="term"><b>Bytes via syscalls</b> (rchar / wchar): everything passed through read and write calls, whether from cache, pipes or sockets. <span class="ex">4.81 MB read</span></div>
<div class="term"><b>Storage reads / writes</b>: bytes that actually reached the disk device. <span class="ex">0 / ≈8 KB over a whole one-turn run</span></div>
<div class="term"><b>fsync</b>: “write this file to the disk now”. pi never calls it, so a crash can lose the end of a session. <span class="ex">0 calls</span></div>
<div class="term"><b>Session file</b>: pi's conversation log, one JSON line per entry, append-only. <span class="ex">7.1 KB after one turn</span></div>
<div class="term"><b>Spill file</b>: <code>/tmp/pi-bash-*.log</code>, the full output of any big bash command, kept forever. <span class="ex">55.8 MB from 3 commands</span></div>
</div>
<div class="card" style="--c:var(--net)"><h3><i></i>Network</h3>
<div class="term"><b>Bytes sent / received</b>: data on the wire. ↑ is upload to the model, ↓ is its reply. <span class="ex">6.4 KB ↑ · 10.1 KB ↓</span></div>
<div class="term"><b>Packets</b>: the pieces data is split into on the network. <span class="ex">7 out · 5 in</span></div>
<div class="term"><b>DNS lookup</b>: turning a name (<code>mockllm</code>) into an IP address. <span class="ex">25 B out · 48 B in</span></div>
<div class="term"><b>TCP connection / keep-alive</b>: a reliable pipe to the server; keep-alive reuses it for every request. <span class="ex">1 for 201 requests</span></div>
<div class="term"><b>HTTP request &amp; headers</b>: the message sent to the model API; headers are its metadata. <span class="ex">≈680 B of headers</span></div>
<div class="term"><b>Streaming (SSE chunks)</b>: the reply arrives as many small events, a few characters each. <span class="ex">50 chunks for 202 chars</span></div>
<div class="term"><b>TLS</b>: the encryption layer of HTTPS, used with the real provider. <span class="ex">1 TLS connection in R1</span></div>
</div>
<div class="card" style="--c:var(--proc)"><h3><i></i>Processes &amp; threads</h3>
<div class="term"><b>Process</b>: a running program with its own memory (pi, bash, rg). <span class="ex">94 for apt-get update</span></div>
<div class="term"><b>Thread</b>: a worker inside a process, sharing its memory. <span class="ex">pi starts 12, 11 alive at once</span></div>
<div class="term"><b>pi's threads</b>: main (runs all JavaScript), 4 V8 workers (compile + GC), 4 libuv workers (file and DNS jobs), a signal thread and a timer thread, plus a helper that exits after ~70 ms.</div>
<div class="term"><b>fork → exec</b>: fork copies a process, exec turns the copy into a new program. That's how every tool starts. <span class="ex">338–671 µs per fork</span></div>
<div class="term"><b>Child / orphan</b>: a child is a process pi started; an orphan outlives its parent (setsid, background jobs, root via sudo).</div>
<div class="term"><b>Process group &amp; SIGKILL</b>: a parent and its children; SIGKILL is the instant, unstoppable kill pi uses on timeouts.</div>
<div class="term"><b>Container / cgroup</b>: an isolated environment; its cgroup is the kernel's box for counting and limiting CPU and memory.</div>
</div>
</div>
<div class="units"><b>Units</b><span>ms = 1/1,000 s</span><span>µs = 1/1,000,000 s</span><span>KB / MB = 1,000 / 1,000,000 bytes (disk, network)</span><span>MiB = 1,048,576 bytes (memory)</span><span>“broken cache” = compile cache off, as in the lab runs</span></div>` });

S.push({ t: "The 7 things we measure", h: `
${head(0, "The 7 things we measure", "How to read this deck")}
<p class="lead">Every step slide has the same strip of seven tiles, the <b>resource meter</b>, so you can compare steps.</p>
${meter({ wall: ["Stopwatch", "how long it took in real time"], cpu: ["Core work", "time cores spent working, all threads added up"], mem: ["RAM held", "RSS = all pages; private = only this process"], sys: ["Kernel calls", "open a file, send bytes, wait…"], disk: ["Storage I/O", "bytes from the disk itself (not the cache)"], net: ["Wire bytes", "sent and received on the network"], proc: ["Workers", "processes (programs) and threads (workers inside one)"] })}
<div class="grid g2">
<div class="card"><h3>CPU time vs wall time</h3>
<p>Wall time is the stopwatch. CPU time is the work: if two threads each work for 10 ms at the same moment, the stopwatch says 10 ms but the CPU bill is 20 ms.</p>
${stack([{ l: "main thread", v: 146.6, c: V("main") }, { l: "4 V8 background threads", v: 43.6, c: V("v8") }, { l: "others", v: 1.8, c: V("oth") }], { h: 40 })}
<p class="small muted" style="margin-top:8px">Example: everything up to the first request (Steps 1–4) took 192 ms of CPU in 146.6 ms of wall time, so on average <b>1.3 vCPUs</b> were busy.</p></div>
<div class="card"><h3>RSS vs private memory</h3>
<p>RSS counts every page a process can see, including code shared with other copies of the same program. <b>Private</b> memory is what each extra agent really adds.</p>
${donut([{ l: "private (each agent pays)", v: 78.1, c: V("mem"), t: "78 MiB" }, { l: "shared code pages (paid once)", v: 49.7, c: V("oth"), t: "50 MiB" }], { c1: "125 MiB", c2: "RSS" })}
</div></div>
<div class="analogy"><b>Think of it as a kitchen.</b> Cores are cooks, wall time is the clock on the wall, CPU time is cook-minutes, memory is counter space, syscalls are trips to the pantry, the network is the delivery window.</div>` });

S.push({ t: "The lab", h: `

S.push({ t: "Step 1 · Start the process", h: `
${head(1, "Getting a process running", "")}
<p class="lead">From “run <code>pi</code>” until Node is ready to run pi's first line of JavaScript. About <b>14.6 ms</b> inside the container.</p>
${meter({ wall: ["14.6 ms", "+ ~51 ms on the host for docker exec"], cpu: ["15.3 ms", "runc 0.6 + Node start 14.7"], mem: ["—", "runc's 10.3 MB is thrown away at exec"], sys: ["~790", "runc 533 + Node 257"], disk: ["0 B", "binary + libs from file cache"], net: ["0 B", ""], proc: ["1 proc", "threads: 5 Go → 7 Node"] })}
${flow([
  { t: "docker exec", d: "host side, ~51 ms wall, not counted as pi", c: "var(--oth)" },
  { t: "runc parent + child", d: "0.84 + 0.31 ms CPU", c: "var(--proc)" },
  { t: "runc init", d: "Go, 5 threads, 533 syscalls, 0.59 ms", c: "var(--proc)" },
  { t: "exec pi", d: "<code>#!/usr/bin/env node</code>", c: "var(--accent)" },
  { t: "find node", d: "/usr/local/sbin ✗ → /usr/local/bin ✓", c: "var(--accent)" },
  { t: "Node starts", d: "12.4 ms wall, ≈14.7 ms CPU", c: "var(--main)" }])}
<div class="grid g2">
<div class="card"><h3>What Node does in those 12.4 ms</h3><ul class="clean small">
<li>Loads 7 shared libraries and OpenSSL's config (12.3 KB), even if TLS is never used.</li>
<li><b>Reads the container's memory limit</b> (<code>memory.max</code>) to size its heap ceiling.</li>

<li>Main-thread syscalls: <code>rt_sigaction</code> 31, <code>mmap</code> 27, <code>fcntl</code> 20.</li></ul></div>
<div class="card"><h3>Threads created here</h3>${hbars([
  { l: "main (runs all JS)", v: 169.3, c: V("main"), t: "169 ms over the run" },
  { l: "4 × V8 workers", v: 70.7, c: V("v8"), t: "71 ms" },
  { l: "signal-inspector", v: 3.1, c: V("oth"), t: "3.1 ms" },
  { l: "timer thread", v: 0.33, c: V("oth"), t: "0.3 ms" },
  { l: "runc's Go threads", v: 0.55, c: V("proc"), t: "0.6 ms (gone)" }], { lw: 250, vw: 210, rh: 32 })}<p class="tiny">CPU these threads use over the whole one-turn run (pid 74367).</p></div>
</div>
<div class="analogy"><b>Like turning the key in a car.</b> Cheap in fuel (CPU), but there is a fixed delay every time, and with Docker the key is on the far side of a long corridor (~51 ms).</div>

S.push({ t: "Step 2 · Load pi's code", h: `
${head(2, "Loading pi's code: the biggest fixed cost", "")}
<p class="lead">Node reads <b>4.5 MB of bundled JavaScript</b>, compiles it and runs its top-level code before <code>main()</code> can start. <b>~110 ms wall, ~144 ms CPU</b>, 58% of a one-turn chat's CPU.</p>

<div class="grid g2">

${stack([{ l: "compiling (module loader)", v: 54.3, c: V("bad") }, { l: "pi's code running at load", v: 64.5, c: V("main") }, { l: "other pi chunks", v: 16, c: V("v8") }, { l: "Node start + GC + V8", v: 21.2, c: V("oth") }], { h: 38 })}

${stack([{ l: "compiling (module loader)", v: 14.7, c: V("bad") }, { l: "pi's code running at load", v: 64.4, c: V("main") }, { l: "other pi chunks", v: 16, c: V("v8") }, { l: "Node start + GC + V8", v: 19.2, c: V("oth") }], { h: 38, total: 156 })}
</div>

S.push({ t: "The compile-cache bug", h: `
${head(0, "A bug we found: the cache was locked", "Step 2 · deep dive")}
<p class="lead">pi asks Node to <b>cache compiled code</b> (<code>enableCompileCache()</code>). In our image that silently failed, so every start compiled from scratch.</p>
${flow([
  { t: "Image build (root)", d: "<code>npm install -g</code> also enables the cache…", c: "var(--oth)" },
  { t: "/tmp/node-compile-cache", d: "created owned by <b>root</b>, mode 755", c: "var(--bad)" },
  { t: "pi runs as agent", d: "calls enableCompileCache()", c: "var(--accent)" },
  { t: "“permission denied”", d: "no error shown, no cache used", c: "var(--bad)" },
  { t: "compiles 4.5 MB", d: "on every start", c: "var(--cpu)" }])}
<div class="grid g2">
<div class="card"><h3>What it cost <span class="tag">no probe, 15 warm runs each</span></h3>
<table><tr><th></th><th class="num">cache broken</th><th class="num">cache working</th><th class="num">saved</th></tr>
<tr><td>one-turn chat: CPU</td><td class="num">227.9 ms</td><td class="num">202.0 ms</td><td class="num"><b>−26 ms</b></td></tr>
<tr><td>one-turn chat: wall</td><td class="num">175.5 ms</td><td class="num">149.1 ms</td><td class="num"><b>−26 ms</b></td></tr>
<tr><td>one-turn chat: RSS</td><td class="num">133.2 MiB</td><td class="num">119.3 MiB</td><td class="num"><b>−14 MiB</b></td></tr>
<tr><td><code>--version</code>: CPU</td><td class="num">152.6 ms</td><td class="num">122.8 ms</td><td class="num"><b>−30 ms</b></td></tr>
<tr><td><code>--version</code>: RSS</td><td class="num">116.2 MiB</td><td class="num">101.8 MiB</td><td class="num"><b>−14 MiB</b></td></tr></table>
<p class="tiny">The first run with a working cache costs ~15 ms more (it writes 2.3 MB in 21 files).</p></div>
<div class="card"><h3>Fix it in any Node agent image</h3><ul class="clean small">
<li>Set <code>NODE_COMPILE_CACHE=$HOME/.cache/node-compile-cache</code>, or</li>
<li><code>rm -rf /tmp/node-compile-cache</code> at the end of the root build step, or</li>
<li>best: run <code>pi --version</code> once <b>as the agent user</b> during the build, so a warm cache ships in the image (fresh containers then start warm).</li></ul>
<div class="analogy" style="margin-top:12px"><b>Pre-chopped vegetables in a fridge someone locked.</b> The cook falls back to chopping everything, every time, and nobody notices.</div></div></div>
<p class="small muted">All other lab numbers in this deck were measured with the cache broken, so pi's startup figures are ~26–30 ms CPU and ~14 MiB higher than a correct install.</p>` });

<div class="card"><h3>What pi touches on disk <span class="tag">strace, one chat</span></h3>${hbars([
  { l: "stat ~/.pi/agent/auth.json", v: 627, c: V("sys") },
  { l: "stat models-store.json", v: 125, c: V("sys") },
  { l: "missing project .pi/* lookups", v: 30, c: V("oth"), t: "~30" },
  { l: "gcloud credentials check", v: 6, c: V("warn") },
  { l: "settings.json reads (each locked)", v: 4, c: V("mem") },
  { l: "models.json reads", v: 4, c: V("mem") }], { lw: 320, vw: 70, rh: 30 })}</div></div>
<div class="grid g3">
<div class="card small"><b>627 stats sound bad, cost ~1 ms.</b> pi re-checks whether <code>auth.json</code> changed on every credential lookup. The kernel answers each in 0.6 µs from cache.</div>
<div class="card small"><b>Every settings read takes a lock</b> (<code>mkdir settings.json.lock</code>). With many agents sharing one config folder, 16 of 32 hit 1–4 lock retries (~14 ms each).</div>
<div class="card small"><b>pi picks up what it finds:</b> project <code>.pi/</code> settings, extensions, skills, prompts, system-prompt overrides, and Google Cloud credentials. Control HOME and the workspace.</div></div>` });

S.push({ t: "Step 4 · First turn", h: `
${head(4, "The first turn: ask the model, get an answer", "")}
<p class="lead"><b>22.7 ms</b>, about 5× a later turn, because it pays two one-time costs: loading the provider code and opening the connection.</p>
${meter({ wall: ["22.7 ms", "steady turn: 4.1 ms"], cpu: ["~58 ms", "Steps 3 + 4 together, all threads"], mem: ["→ 141.8 MiB", "heap 24.0 / 38.5 MiB"], sys: ["~240", "main: write 121, read 77, epoll 42"], disk: ["7.1 KB", "session file created, never fsync'd"], net: ["6.4 KB ↑ 10.1 KB ↓", "1 DNS lookup, 1 TCP connection"], proc: ["1 proc", "12 threads, 0 children"] })}
<div class="grid g2">
<div class="card"><h3>Phases <span class="tag">ms</span></h3>
<p class="small muted" style="margin:0 0 4px">First turn</p>${stack([{ l: "build request (incl. 9.4 ms loading provider code)", v: 10.35, c: V("main") }, { l: "model call (incl. DNS + TCP connect)", v: 7.49, c: V("net") }, { l: "stream reply + save", v: 4.86, c: V("disk") }], { h: 36, total: 22.7 })}
<p class="small muted" style="margin:12px 0 4px">A steady turn, for comparison (same scale)</p>${stack([{ l: "build", v: 0.96, c: V("main") }, { l: "model", v: 0.46, c: V("net") }, { l: "rest", v: 2.67, c: V("disk") }, { l: "", v: 18.61, c: "transparent", short: "" }], { h: 36, total: 22.7 })}</div>
<div class="card"><h3>What the request contains <span class="tag">bytes</span></h3>${stack([{ l: "system prompt", v: 2578, c: V("mem") }, { l: "4 tool schemas", v: 2841, c: V("cpu") }, { l: "user message + params", v: 283, c: V("net") }, { l: "20 HTTP headers", v: 680, c: V("oth") }], { h: 36, unit: "B" })}
<p class="small" style="margin-top:10px">Headers come from OpenAI's SDK and include <code>x-stainless-os / arch / runtime-version</code>: <b>the endpoint learns your OS, CPU and Node version.</b></p></div></div>
<div class="card"><h3>A 202-character answer becomes 34 KB of output</h3>${hbars([
  { l: "the answer text", v: 202, c: V("good"), t: "202 B" },
  { l: "on the wire (50 SSE chunks)", v: 10124, c: V("net"), t: "10.1 KB · 50×" },
  { l: "pi's json stdout (64 events)", v: 34333, c: V("cpu"), t: "34.3 KB · 170×" }], { lw: 270, vw: 150, rh: 32 })}
<p class="small muted">Each 4-character piece arrives in its own JSON envelope, and pi's json output repeats the full token-usage object (~300 B) on every one of the 52 update events.</p></div>` });

S.push({ t: "Everything until the first request", h: `
${head(0, "Totals up to the moment the first request goes out", "Steps 1–4 added up")}
<p class="lead">Measured with a tiny preload that reads exact counters at that moment (median of 9 runs, no lab probe). <b>Broken cache → working cache.</b></p>

<div class="card" style="border-top:4px solid var(--mem)"><div class="tiny">Memory (RSS)</div><div class="big">125<small>MiB</small></div><div class="small muted">111 MiB with cache · 78 / 65 MiB private</div></div>
<div class="card" style="border-top:4px solid var(--sys)"><div class="tiny">Syscalls</div><div class="big">5,022</div><div class="small muted">futex 1,359 · mprotect 976 · statx 883</div></div>
</div>
<div class="grid g2" style="margin-top:14px">

  { l: "CPU", v: 92.8, c: V("cpu"), t: "93%  (192 of 207 ms)" },

<tr><td>Page faults</td><td class="num">19,107 minor · <b>0 major</b></td></tr>
<tr><td>Context switches</td><td class="num">477 voluntary · 0 forced</td></tr>
<tr><td>Bytes read via syscalls</td><td class="num">4.81 MB (all from file cache)</td></tr>
<tr><td>Storage read / written</td><td class="num"><b>0 / 0 B</b></td></tr>
<tr><td>Network so far</td><td class="num">272 B out · 140 B in (DNS + handshake)</td></tr>
<tr><td>Threads / open files</td><td class="num">11 / 23</td></tr>
<tr><td>Memory: heap / outside heap / shared code</td><td class="num">22 / 13 / 50 MiB</td></tr></table></div></div>` });

S.push({ t: "How many fit on 2 vCPU", h: `
${head(0, "How many pi agents fit on a 2-vCPU machine?", "Capacity, up to the first request")}
<p class="lead">We pinned a container to exactly 2 vCPUs and started N agents at the same instant (compile cache working).</p>
<div class="grid g2">
<div class="card"><h3>Seconds until all N have sent their first request</h3>${line([{ pts: [[1, 0.12], [2, 0.19], [4, 0.34], [8, 0.68], [16, 1.41], [32, 3.09]], c: V("cpu"), dots: 1 }], { xl: "agents started at once", yl: "seconds", xmin: 0, xmax: 32, ymax: 4, yticks: 4, xticks: 8, yf: (v) => v.toFixed(0), notes: [[30.5, 3.45, "32 agents → 3.1 s", "end"]] })}
<p class="small">≈ <b>N × 0.09 s</b>: 2 vCPUs push through about <b>11–12 starts per second</b>. Crowding raised CPU per agent only 1.05–1.14×.</p></div>
<div class="card"><h3>Container memory while all wait</h3>${line([{ pts: [[1, 78], [2, 136], [4, 257], [8, 552], [16, 1134], [32, 2288]], c: V("mem"), dots: 1, area: 1 }], { xl: "agents alive", yl: "MiB", xmin: 0, xmax: 32, ymax: 2500, yticks: 5, xticks: 8, notes: [[28, 2380, "≈70 MiB per agent", "end"]] })}
<p class="small">About <b>70 MiB per agent</b> plus ~50 MiB of shared code once. Don't add up RSS: it double-counts shared pages.</p></div></div>
<div class="grid g3">
<div class="card" style="border-top:4px solid var(--mem)"><div class="tiny">2 vCPU + 4 GiB RAM</div><div class="big">~50<small>agents</small></div><div class="small muted">memory runs out first</div></div>
<div class="card" style="border-top:4px solid var(--mem)"><div class="tiny">2 vCPU + 8 GiB RAM</div><div class="big">~105<small>agents</small></div><div class="small muted">memory runs out first</div></div>
<div class="card" style="border-top:4px solid var(--cpu)"><div class="tiny">CPU while they wait for the model</div><div class="big">~3<small>ms / s each</small></div><div class="small muted">3.2–3.3 ms/s measured under load (≤13 on an idle VM, mostly the lab probe): CPU allows hundreds</div></div></div>
<p class="small muted">Only up to the first request. Memory per agent keeps growing with every turn (Step 8), so long sessions fit fewer.</p>` });

S.push({ t: "Step 5 · A steady turn", h: `
${head(5, "A steady turn, phase by phase", "")}
<p class="lead">In a 200-turn bash loop (model answers instantly), one turn takes <b>4.09 ms</b> of wall time and <b>5.0 ms</b> of pi CPU: pi keeps about <b>1.1 cores</b> busy while looping.</p>
${meter({ wall: ["4.09 ms", "per turn (median)"], cpu: ["5.0 ms", "main 3.29 · V8 1.69 · libuv 0.02"], mem: ["+0.33 MiB", "per turn, never given back"], sys: ["~139", "per turn, all threads"], disk: ["+842 B", "2 session appends, no fsync"], net: ["5.6 KB + 237 B×turn ↑", "≈1.5 KB ↓ · same connection"], proc: ["+1 bash", "0.80 ms CPU, 2.6 MiB"] })}
<div class="card"><h3>One turn <span class="tag">ms, median of 200</span></h3>${stack([{ l: "build request", v: 0.96, c: V("main"), short: "build" }, { l: "model", v: 0.46, c: V("net"), short: "" }, { l: "parse reply + tool args", v: 0.56, c: V("v8"), short: "" }, { l: "run the tool (bash child)", v: 1.74, c: V("proc"), short: "tool 1.74 ms" }, { l: "events + save", v: 0.25, c: V("disk"), short: "" }], { h: 50, total: 3.97 })}</div>
<div class="grid g2" style="margin-top:14px">
<div class="card"><h3>pi's main-thread syscalls per turn <span class="tag">200-turn average · these 16 = 117 of 126</span></h3>${hbars([{ l: "write (stdout events, socket, probe)", v: 34.5, c: V("sys") }, { l: "faccessat (file exists?)", v: 13.4, c: V("sys") }, { l: "read", v: 10.6, c: V("sys") }, { l: "futex (thread hand-offs)", v: 9.5, c: V("sys") }, { l: "close", v: 8.2, c: V("sys") }, { l: "setsockopt", v: 8.0, c: V("sys") }, { l: "rt_sigprocmask", v: 6.2, c: V("sys") }, { l: "epoll_pwait (wait for events)", v: 6.0, c: V("sys") }, { l: "statx", v: 5.0, c: V("sys") }, { l: "munmap", v: 3.3, c: V("sys") }, { l: "openat", v: 2.2, c: V("sys") }, { l: "rt_sigaction", v: 2.2, c: V("sys") }, { l: "epoll_ctl", v: 2.0, c: V("sys") }, { l: "socketpair (pipe to bash)", v: 2.0, c: V("proc") }, { l: "ioctl", v: 2.0, c: V("sys") }, { l: "shutdown", v: 2.0, c: V("sys") }], { lw: 330, vw: 50, compact: 1 })}<p class="tiny">All threads: ≈139 per steady turn. About 13 of the writes are the lab probe.</p></div>
<div class="card"><h3>What else a turn produces</h3><table class="small">
<tr><td>Request body</td><td class="num">5,593 B + 237 B per earlier turn</td></tr>
<tr><td>HTTP headers</td><td class="num">≈680 B</td></tr>
<tr><td>Reply</td><td class="num">≈1.5 KB (2–5 chunks)</td></tr>
<tr><td>stdout json events</td><td class="num">≈4.1 KB in 19 writes</td></tr>
<tr><td>Session file</td><td class="num">+842 B (open, write, close × 2)</td></tr>
<tr><td>Garbage collection</td><td class="num">0.12 ms</td></tr>
<tr><td>Data from bash back to pi</td><td class="num">≈8 B over a socket pair</td></tr></table>
<div class="analogy small" style="margin-top:10px"><b>Each turn is cheap.</b> The trouble is the line “+237 B per earlier turn”: the request keeps getting longer (Step 8).</div></div></div>` });

S.push({ t: "Step 6 · Tools at the OS level", h: `
${head(6, "What each tool costs the operating system", "")}
<p class="lead">Some tools run inside pi. Others start new programs, and starting a program from Node means <b>copying the whole Node process first</b>.</p>
<div class="grid g3">
<div class="card" style="border-top:4px solid var(--good)"><h3>read · write · edit · ls</h3><div class="big">0<small>processes</small></div><p class="small">Run inside pi: 0.6–1.8 ms. <b>But</b> <code>read</code> loads whole files: three reads of a 19.5 MB file pushed RSS to 321.5 MiB.</p></div>
<div class="card" style="border-top:4px solid var(--proc)"><h3>bash</h3><div class="tree">pi ─fork→ copy of pi ─exec→ bash</div><p class="small">0.80 ms CPU, 2.6 MiB per call. The copy is what costs pi time (chart →).</p></div>
<div class="card" style="border-top:4px solid var(--warn)"><h3>grep</h3><div class="tree">pi ─┬─ rg --version  ← every call
    └─ rg search</div><p class="small">2 processes: 1.03 + 3.94 ms. The version check blocks pi's main thread and is never cached.</p></div>
<div class="card" style="border-top:4px solid var(--bad)"><h3>find</h3><div class="tree">pi ─┬─ fd --version      ✗ not found
    ├─ fdfind --version
    └─ fdfind …          ✗ rejects flag</div><p class="small">Debian's fdfind rejects pi's <code>--no-require-git</code>: <b>89 of 89 calls failed</b>. pi's own downloaded fd works (36–44 ms, 20 threads).</p></div>
<div class="card" style="border-top:4px solid var(--proc)"><h3>sudo apt-get update</h3><div class="big">94<small>processes</small></div><p class="small">829 ms of child CPU: 609 ms as the <code>_apt</code> user, 217 ms as root. Reads 78.6 MB, writes 28.9 MB.</p></div>
<div class="card"><h3>Fork cost grows with pi's memory</h3>${line([{ pts: [[145, 338], [279, 515], [354, 671]], c: V("proc"), dots: 1 }], { xl: "pi RSS (MiB)", yl: "µs blocked per spawn", xmin: 100, xmax: 380, ymin: 0, ymax: 750, xticks: 4, yticks: 3, h: 210, w: 420 })}<p class="tiny">≈103 µs + 1.56 µs per MiB, on pi's main thread.</p></div>
</div>
<div class="analogy"><b>Fork is like photocopying the whole kitchen's floor plan to make one sandwich.</b> The bigger the kitchen (pi's memory), the longer the photocopy.</div>` });

S.push({ t: "Step 6 · Side effects", h: `
${head(6, "Tools: parallel calls, timeouts and leftovers", "")}
<div class="grid g2">
<div class="card"><h3>Parallel tool calls: no limit</h3><div class="big">16 → 16<small>processes in 12–33 ms</small></div><p>If the model asks for 16 tool calls in one message, pi starts all 16 at once. Nothing throttles it, so one reply can spike a machine.</p></div>
<div class="card"><h3>Timeouts: some children survive</h3><p>A timed-out command gets <code>SIGKILL</code> on its whole process group, instantly, no grace period. But these <b>outlive pi</b>:</p><ul class="clean small"><li>children running as root under <code>sudo</code></li><li>anything started with <code>setsid</code></li><li>background jobs (<code>cmd &amp;</code>)</li></ul></div>
<div class="card"><h3>sudo</h3><ul class="clean small"><li>With a password policy, <code>sudo</code> fails instantly: there is no terminal to type into.</li><li>But <code>echo pw | sudo -S …</code> works (17 ms). A model that knows the password gets root.</li><li><code>sudo -n id</code> with a NOPASSWD rule: 6.8 ms.</li></ul></div>
<div class="card"><h3>Environment</h3><p>Every tool inherits pi's <b>full environment</b>, including any API keys or secrets in it (we planted a fake one, and tools could read it). No seccomp filter.</p></div></div>
<div class="warnbox"><b>For your project:</b> cap parallel tool calls yourself, run each agent in its own container or cgroup so orphans die with it, and keep secrets out of the agent's environment.</div>` });

S.push({ t: "Step 7 · Saving results", h: `
${head(7, "Saving results: session file, spill files, stdout", "")}
<div class="grid g2">
<div class="card"><h3>Session file size at the end <span class="tag">KB</span></h3>${hbars([{ l: "1-turn chat", v: 7.1, c: V("disk"), t: "7.1 KB" }, { l: "200 bash turns", v: 175.6, c: V("disk"), t: "176 KB" }, { l: "300 mixed-tool turns", v: 948.2, c: V("disk"), t: "948 KB" }, { l: "30 turns × 48 KB outputs", v: 1566.7, c: V("disk"), t: "1.57 MB" }], { lw: 230, vw: 100, rh: 32 })}
<p class="small">≈ <b>7.1 KB + 0.84–1.07 KB per turn + 1.06 × tool output</b>. Append-only, never shrinks, even after compaction.</p></div>
<div class="card"><h3>Three things that surprise people</h3><ul class="clean">
<li><b>Never fsync'd.</b> 0 fsync calls in any run. A crash or power loss can lose the end of a session.</li>
<li><b>Spill files are never deleted.</b> Any bash output over 50 KB / 2,000 lines is also saved to <code>/tmp/pi-bash-*.log</code>. Three big commands left <b>55.8 MB</b> behind.</li>
<li><b>json stdout repeats tool results 4–7 times</b>, and the final <code>agent_end</code> event carries the whole transcript (6.5 KB → 1.49 MB).</li></ul></div></div>
<div class="card"><h3>How the final event grows with the session</h3>${hbars([{ l: "1-turn chat", v: 6.5, c: V("cpu"), t: "6.5 KB" }, { l: "200 bash turns", v: 132.6, c: V("cpu"), t: "133 KB" }, { l: "300 mixed turns", v: 873.5, c: V("cpu"), t: "874 KB" }, { l: "30 × 48 KB outputs", v: 1490, c: V("cpu"), t: "1.49 MB" }], { lw: 230, vw: 100, rh: 30 })}</div>
<div class="take"><b>For your project:</b> clean <code>/tmp/pi-bash-*.log</code> yourself, don't rely on the session file surviving a crash, and if you parse pi's json output, read only the events you need.</div>` });

S.push({ t: "Step 8 · Growth", h: `
${head(8, "Long conversations: everything gets heavier", "")}
<p class="lead">pi sends the <b>whole conversation with every request</b>. Request size grows in a straight line, so total upload grows with the <b>square</b> of the number of turns.</p>
<div class="grid g2">
<div class="card"><h3>Size of each request <span class="tag">KB</span></h3>${line([{ pts: req05, c: V("bad"), label: "mixed tools: up to 727 KB", labelAt: [150, 520] }, { pts: req04, c: V("net"), label: "bash echo: 5.6 → 53 KB", labelAt: [205, 95], anchor: "start" }], { xl: "turn", yl: "KB per request", xmin: 0, xmax: 300, ymax: 800, yticks: 4, xticks: 6, notes: [[286, 240, "compaction ↓", "end"]] })}</div>
<div class="card"><h3>Total uploaded so far <span class="tag">MB</span></h3>${line([{ pts: cum(req05), c: V("bad"), label: "mixed: ≈108 MB", area: 1 }, { pts: cum(req04), c: V("net"), label: "bash: 5.9 MB", labelAt: [205, 9], anchor: "start" }], { xl: "turn", yl: "MB sent", xmin: 0, xmax: 300, ymax: 120, yticks: 4, xticks: 6 })}</div>
<div class="card"><h3>Memory (RSS) over the session <span class="tag">MiB</span></h3>${line([{ pts: [[1, 151], [49, 178], [100, 235], [149, 251], [200, 331], [220, 359], [250, 341], [290, 369], [301, 345.6]], c: V("bad"), dots: 1, label: "mixed: 151 → 369", labelAt: [40, 300], anchor: "start" }, { pts: [[1, 146], [20, 146], [51, 153], [100, 167], [150, 173], [151, 188], [200, 210]], c: V("net"), dots: 1, label: "bash: 146 → 210", labelAt: [210, 205], anchor: "start" }], { xl: "turn", yl: "MiB", xmin: 0, xmax: 300, ymin: 100, ymax: 400, xticks: 6 })}</div>
<div class="card"><h3>Time to build each request <span class="tag">ms</span></h3>${line([{ pts: [[10, 0.83], [125, 1.57], [225, 2.31], [270, 2.5], [296, 0.99]], c: V("bad"), dots: 1, label: "mixed" }, { pts: [[10, 0.77], [75, 0.86], [125, 1.03], [175, 1.34]], c: V("net"), dots: 1, label: "bash" }], { xl: "turn (bucket middle)", yl: "ms", xmin: 0, xmax: 300, ymax: 2.8, xticks: 6, yf: (v) => v.toFixed(1) })}</div></div>
<div class="analogy"><b>Like re-reading the whole book aloud every time you add a sentence.</b> Each new sentence is small; the reading isn't.</div>` });

S.push({ t: "Step 9 · Compaction", h: `
${head(9, "Compaction: summarising the conversation", "")}
<p class="lead">When the request gets too big, pi asks the model to summarise the conversation and continues from the summary.</p>
<div class="grid g3">
<div class="card"><h3>Request size</h3>${hbars([{ l: "before", v: 727, c: V("bad"), t: "727 KB" }, { l: "after", v: 97.4, c: V("good"), t: "97 KB" }], { lw: 90, vw: 90, rh: 40 })}<p class="small">One summary request of 235.6 KB, 7.5 ms.</p></div>
<div class="card"><h3>Request build time</h3>${hbars([{ l: "before", v: 2.5, c: V("bad"), t: "2.50 ms" }, { l: "after", v: 0.99, c: V("good"), t: "0.99 ms" }], { lw: 90, vw: 90, rh: 40 })}<p class="small">Per-turn work drops back to early-session levels.</p></div>
<div class="card"><h3>Memory (RSS)</h3>${hbars([{ l: "before", v: 341, c: V("bad"), t: "341 MiB" }, { l: "after", v: 346, c: V("bad"), t: "346 MiB" }], { lw: 90, vw: 90, rh: 40, max: 360 })}<p class="small"><b>No drop at all.</b> The old messages stay in memory.</p></div></div>
<div class="grid g2" style="margin-top:14px">
<div class="card"><h3>What else happens</h3><ul class="clean small"><li>The session file <b>keeps growing</b>: the summary is appended, nothing is removed.</li><li>pi opens a <b>second TCP connection</b> right after compacting.</li><li>In a 64k-context run, compaction fired every ~3 turns once requests reached ~155 KB (→ 56.5 KB).</li></ul></div>
<div class="analogy" style="margin:0"><b>Like summarising a book onto one page but still carrying every old page in your backpack.</b> Lighter to read, just as heavy to carry.</div></div>
<div class="take"><b>For your project:</b> compaction keeps requests (and the model bill) in check, but not memory. Recycle the process for very long sessions.</div>` });

S.push({ t: "Step 10 · Streaming & output modes", h: `
${head(10, "Streaming: the TUI costs 5× more", "")}
<p class="lead">pi can print plain text, json events, rpc, or draw a full terminal UI (TUI). At a realistic ~55 chunks per second, the choice matters.</p>
<div class="grid g2">
<div class="card"><h3>CPU per second while streaming a 12k-char answer</h3>${hbars([{ l: "json", v: 35.3, c: V("net"), t: "35 ms/s (3.5% of a core)" }, { l: "TUI", v: 184.8, c: V("bad"), t: "185 ms/s (18.5%)" }], { lw: 80, vw: 230, rh: 46 })}
<p class="small">The TUI's cost <b>climbs as the message grows</b> (139 → 230 ms/s) and its RSS goes 165 → 291 MiB. json stays flat at ~144 MiB.</p></div>
<div class="card"><h3>CPU per streamed chunk <span class="tag">ms, includes the idle floor</span></h3>${line([{ pts: [[0, 2.5], [56, 4.2]], c: V("bad"), dots: 1, label: "TUI: 2.5 → 4.2" }, { pts: [[0, 0.5], [56, 0.5]], c: V("net"), dots: 1, label: "json: ≈0.5 (0.45–0.57)" }], { xl: "seconds into the stream", yl: "ms per chunk", xmin: 0, xmax: 60, ymax: 4.5, h: 230, xticks: 6, yf: (v) => v.toFixed(1) })}</div>
<div class="card"><h3>A 40k-character answer at full speed <span class="tag">total CPU</span></h3>${hbars([{ l: "print", v: 400.2, c: V("good"), t: "400 ms" }, { l: "json", v: 512.1, c: V("net"), t: "512 ms" }, { l: "rpc", v: 512.6, c: V("net"), t: "513 ms" }, { l: "TUI", v: 707.9, c: V("bad"), t: "708 ms" }], { lw: 80, vw: 90, rh: 32 })}</div>
<div class="card"><h3>Bytes written for that answer</h3>${hbars([{ l: "print", v: 40, c: V("good"), t: "40 KB" }, { l: "TUI (to terminal)", v: 528, c: V("bad"), t: "528 KB" }, { l: "json", v: 2683, c: V("net"), t: "2.68 MB · 10,050 writes" }], { lw: 150, vw: 200, rh: 32 })}<p class="tiny">Resizing the terminal costs a 58–134 ms CPU spike.</p></div></div>
<div class="take"><b>For your project:</b> for agents running unattended, use json or rpc mode. Keep the TUI for humans.</div>` });

S.push({ t: "Step 11 · Idle & background", h: `
${head(11, "Idle and background work", "")}
<div class="grid g3">
<div class="card"><h3>Sitting idle</h3><div class="big">≤13<small>ms CPU / s</small></div><p class="small">An idle TUI or rpc process: at most ~1.3% of a core, and most of that is our probe. ~350 event-loop wake-ups per second. Memory stays flat (~147 MiB).</p></div>
<div class="card"><h3>Phoning home</h3><div class="big">2<small>HTTPS calls</small></div><p class="small">The online TUI calls pi.dev at start (latest version, install report): 12.6 KB in, 3.9 KB out, closed after ~4.7 s. json mode never does.</p></div>
<div class="card"><h3>Cache warmer</h3><div class="big">20<small>s</small></div><p class="small">While idle, pi can send 1-token requests every 20 s to keep a prompt cache warm (30 s TTL), when the cache savings are worth ≥ $0.05.</p></div></div>
<div class="card" style="margin-top:14px"><h3>Retries when the provider fails (429 / 503)</h3>
${gantt([{ n: "pi", s: [[0, 0.3, V("bad"), "", 1], [2, 2.3, V("bad"), "", 1], [6, 6.3, V("bad"), "", 1], [14, 14.3, V("bad"), "", 1], [14.3, 16, V("oth"), "gives up, exit code 0", 0.6, "var(--fg)"]] }], { tmax: 16, tick: 2, markers: [[0, "try 1"], [2, "+2 s"], [6, "+4 s"], [14, "+8 s"]] })}
<ul class="clean small"><li>Fixed waits of 2, 4, 8 s. <b>Ignores the provider's <code>Retry-After</code></b> header.</li><li><b>Exits with code 0 after giving up</b>, so a script can't tell failure from success by the exit code.</li></ul></div>` });

S.push({ t: "Step 12 · Exit & leftovers", h: `
${head(12, "Exit, and what's left behind", "")}
${meter({ wall: ["18.6 ms", "after the last event"], cpu: ["25.4 ms", "tear-down"], mem: ["freed", "peak = final in long runs"], sys: ["—", ""], disk: ["0 fsync", "in any run"], net: ["FIN", "connection closed"], proc: ["all threads", "end within ~1 ms"] })}
<div class="grid g2">
<div class="card"><h3>Left behind after pi exits</h3><table class="small">
<tr><td>Session file</td><td>stays, keeps growing across runs, never fsync'd</td></tr>

<tr><td>Orphans after a timeout</td><td>root sudo children, setsid and background jobs</td></tr>
<tr><td><code>auth.json</code>, <code>models-store.json</code></td><td>created on the first run in a fresh HOME</td></tr>

<table class="small"><tr><td>CPU</td><td class="num"><b>246.5 ms</b></td></tr><tr><td>Wall</td><td class="num"><b>191.8 ms</b></td></tr><tr><td>Peak RSS</td><td class="num"><b>146.5 MiB</b></td></tr><tr><td>Syscalls</td><td class="num">≈6,300</td></tr><tr><td>Threads</td><td class="num">12</td></tr><tr><td>Bytes read / written via syscalls</td><td class="num">4.85 MB / 51.7 KB</td></tr><tr><td>Network</td><td class="num">6.4 KB ↑ · 10.1 KB ↓</td></tr></table>
<p class="tiny">Without the lab probe and with the cache fixed: ~175 ms CPU, ~125 ms wall, ~122 MiB.</p></div></div>` });

S.push({ t: "Step 13 · Many agents", h: `
${head(13, "Many agents at once", "")}
<p class="lead">On the 18-vCPU VM we ran 1, 4, 16 and 32 agents together, each doing a 30-turn tool loop with an instant model.</p>

<div class="card" style="border-top:4px solid var(--wall)"><div class="tiny">400 ms model latency</div><div class="big">~34<small>agents / vCPU</small></div><div class="small muted">at 100%; ~20 at a 60% target</div></div>
<div class="card" style="border-top:4px solid var(--mem)"><div class="tiny">Real model</div><div class="big">memory<small>is the limit</small></div><div class="small muted">~28 ms CPU/s per agent; RAM runs out first</div></div></div>` });

S.push({ t: "Step 14 · Real model", h: `
${head(14, "With a real model: mostly waiting", "")}
<p class="lead">R1: pi fixed a buggy Python module with a free OpenRouter model. 16 tool calls (11 bash, 4 read, 1 edit) over 17 turns, tests pass, <b>78.8 s</b>.</p>
<div class="grid g2">
<div class="card"><h3>Where the wall time went</h3>${donut([{ l: "waiting on the model", v: 98.5, c: V("wall"), t: "97.4–99.5%" }, { l: "pi + tools working", v: 1.5, c: V("cpu"), t: "0.5–2.6%" }], { c1: "~98%", c2: "waiting" })}
<p class="small">Model time per turn: <b>1,556 ms</b> median (mean 4.6 s, pulled up by two long reasoning turns). pi building that request: <b>2.2 ms</b> median, ~700× less.</p></div>
<div class="card"><h3>R1's bill</h3><table class="small">
<tr><td>pi CPU</td><td class="num"><b>2,154 ms</b> (27.3 ms per second)</td></tr>

<tr><td>CPU spent while tokens stream in</td><td class="num">78.5%</td></tr>

<div class="analogy" style="margin:0"><b>Like a waiter.</b> Taking the order is quick (pi), the kitchen is slow (the model). The waiter mostly stands there, but still takes up floor space (memory).</div></div>` });

S.push({ t: "Cheat sheet", h: `
${head(0, "The resource model on one slide", "Cheat sheet")}
<div class="grid g2">
<div class="card"><table>
<tr><th>Resource</th><th>Rule of thumb (measured)</th></tr>
<tr><td><b style="color:var(--cpu)">Startup CPU</b></td><td>~250 ms per process (lab) · ~200 ms with the compile cache, no probe</td></tr>
<tr><td><b style="color:var(--cpu)">CPU per turn</b></td><td>≈ 5.4 ms + 0.009 ms × request KB <span class="muted">(instant model)</span></td></tr>
<tr><td><b style="color:var(--cpu)">Tool children</b></td><td>bash 0.8 ms · grep ~5 ms (2 procs) · fd ~40 ms</td></tr>
<tr><td><b style="color:var(--cpu)">Real model</b></td><td>~18 ms/s while streaming + ~0.17 ms per token</td></tr>
<tr><td><b style="color:var(--mem)">Memory per process</b></td><td>RSS ≈ max(157, 134 + 0.41 × turns + 0.18 × request KB) MiB <span class="muted">(floor for ≤30 turns)</span></td></tr>
<tr><td><b style="color:var(--mem)">Memory for N agents</b></td><td>≈ 18 + 102 × N MiB (short sessions)</td></tr>
</table></div>
<div class="card"><table>
<tr><th>Resource</th><th>Rule of thumb (measured)</th></tr>
<tr><td><b style="color:var(--net)">Request size</b></td><td>base (≈5.6 KB) + growth per turn (237 B … 2.5 KB)</td></tr>
<tr><td><b style="color:var(--net)">Total upload</b></td><td>≈ (T+1) × base + growth × T(T+1)/2 → <b>quadratic</b></td></tr>
<tr><td><b style="color:var(--disk)">Session file</b></td><td>≈ 7.1 KB + 0.84–1.07 KB per turn + 1.06 × tool output</td></tr>
<tr><td><b style="color:var(--disk)">Temp files</b></td><td>every bash output over 50 KB, kept forever</td></tr>
<tr><td><b style="color:var(--proc)">Threads</b></td><td>12 started per pi process (11 alive at once)</td></tr>
<tr><td><b style="color:var(--proc)">Processes</b></td><td>bash 1 · grep 2 · find 1–3 · parallel calls: unlimited</td></tr>
</table></div></div>
<div class="take">The shape in one line: <b>a big fixed start (~0.25 s CPU, ~150 MiB), a cheap turn (~5 ms), and costs that grow with conversation length</b>, with memory, not CPU, the first thing to run out.</div>` });

S.push({ t: "Rules for your project", h: `
${head(0, "Six rules if you build on a harness like this", "Takeaways")}
<div class="grid g2">
<div class="card" style="border-top:4px solid var(--mem)"><h3>1 · Budget memory, not CPU</h3><p>~100 MiB private per agent, plus ~0.4 MiB per turn and ~0.18 MiB per KB of context. Compaction gives nothing back: recycle long sessions.</p></div>
<div class="card" style="border-top:4px solid var(--cpu)"><h3>2 · Start fewer processes</h3><p>Each start costs ~0.2–0.25 s of CPU. Keep one process alive (rpc mode) instead of one per task, and make sure the compile cache actually works.</p></div>
<div class="card" style="border-top:4px solid var(--net)"><h3>3 · Plan for quadratic context</h3><p>Every request re-sends everything. Compact early, and trim big tool output: it's billed again on every later request.</p></div>
<div class="card" style="border-top:4px solid var(--proc)"><h3>4 · Watch tool spawning</h3><p>Each spawn copies the Node process, slower as it grows. grep/find add blocking version checks. Cap parallel calls yourself.</p></div>
<div class="card" style="border-top:4px solid var(--disk)"><h3>5 · Clean up after it</h3><p>Delete <code>/tmp/pi-bash-*.log</code>. Don't trust session files after a crash. Contain orphans with a per-agent container or cgroup. Keep secrets out of its environment.</p></div>
<div class="card" style="border-top:4px solid var(--bad)"><h3>6 · Use json/rpc for machines</h3><p>The TUI costs ~5× json per streamed chunk and keeps growing. Parse only the events you need.</p></div></div>` });

S.push({ t: "How it was measured", h: `
${head(0, "How this was measured, and how far to trust it", "Method")}
<div class="grid g3">
<div class="card"><h3>Instruments</h3><ul class="clean small"><li><b>eBPF</b> (bpftrace): every exec, fork, exit, exact CPU and peak memory per process and thread, syscalls, files, sockets, TCP, signals.</li><li><b>/proc + cgroup</b> every 100 ms: memory, CPU, network, threads.</li><li><b>In-process probe</b> in Node: event loop, heap, GC, HTTP timing, spawns.</li></ul></div>
<div class="card"><h3>Trust</h3><ul class="clean small"><li>eBPF CPU matches the container's own counters within <b>0–1.5%</b>.</li><li>The probe adds <b>+4.7% CPU, +12% wall</b> (included in lab numbers).</li><li>Every analysis was re-checked by an adversarial verifier against the database.</li></ul></div>
<div class="card"><h3>Caveats</h3><ul class="clean small"><li>The mock answers instantly: real models make pi mostly wait (Step 14).</li><li>The compile cache was broken in all lab runs (Step 2).</li><li>One machine: Docker Desktop on Apple silicon, warm file cache.</li></ul></div></div>

// ---------- deck runtime ----------
const deck = document.getElementById("deck");
deck.innerHTML = S.map((s, i) => `<section class="slide${s.w ? " wide" : ""}" id="s${i}" aria-label="${esc(s.t)}">${s.h}</section>`).join("");
document.getElementById("ovlist").innerHTML = S.map((s, i) => `<a href="#${i + 1}" onclick="toggleOv()"><span>${i + 1}</span>${esc(s.t)}</a>`).join("");
let cur = 0;
function go(i) {
  cur = Math.max(0, Math.min(S.length - 1, i));
  document.querySelectorAll(".slide").forEach((el, k) => el.classList.toggle("on", k === cur));
  fit(document.getElementById("s" + cur));
  document.getElementById("cnt").textContent = `${cur + 1} / ${S.length}`;
  document.querySelector("#prog div").style.width = `${((cur + 1) / S.length) * 100}%`;
  if (location.hash !== `#${cur + 1}`) history.replaceState(null, "", `#${cur + 1}`);
  window.scrollTo(0, 0);
}
// scale a slide up to use big screens (never down; small screens scroll)
function fit(el) {
  el.style.zoom = 1;
  if (innerWidth < 1100) return;
  const top = el.getBoundingClientRect().top, bottom = Math.max(...[...el.children].map((c) => c.getBoundingClientRect().bottom)) - top + 24;
  const z = Math.max(1, Math.min(1.35, (innerWidth - 40) / (el.classList.contains("wide") ? 1600 : 1240), (innerHeight - 64) / bottom));
  el.style.zoom = z.toFixed(3);
}
addEventListener("resize", () => fit(document.getElementById("s" + cur)));
function toggleOv() { document.getElementById("ov").classList.toggle("on"); }
function toggleTheme() {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("learn-theme", r.dataset.theme); } catch (e) {}
}
try { const t = localStorage.getItem("learn-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(S.length - 1);
  else if (e.key === "o" || e.key === "O") toggleOv();
  else if (e.key === "Escape") document.getElementById("ov").classList.remove("on");
});
addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1), 10); if (n) go(n - 1); });
go((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
