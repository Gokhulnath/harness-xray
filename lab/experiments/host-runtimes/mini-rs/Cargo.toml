[package]
name = "mini"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
futures-util = "0.3"
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3
